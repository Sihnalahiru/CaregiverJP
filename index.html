<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F7FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B101B" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CaregiverJP" />
    <meta
      name="description"
      content="SSW Nursing Care study portal with 555 interactive English and Sinhala MCQs across 13 paper sets, offline PWA support, progress analytics, and achievements."
    />
    <meta property="og:title" content="HiCare · CaregiverJP — SSW Nursing Care Study PWA" />
    <meta
      property="og:description"
      content="SSW Nursing Care study portal with 555 interactive English and Sinhala MCQs across 13 paper sets, offline PWA support, and achievements."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>HiCare · SSW Nursing Care Study (English + සිංහල)</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('ssw_care_pwa_v1_settings');
          var parsed = raw ? JSON.parse(raw) : null;
          var theme = parsed && parsed.theme ? parsed.theme : 'system';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (theme === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F6F7FB] text-[#131A2C] antialiased dark:bg-[#0B101B] dark:text-[#F1F5FB]">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
